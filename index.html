<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Cell Performance Ladder — 燃料電池性能天梯</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
body { font-family: 'Segoe UI', sans-serif; margin: 2rem; background: #fafafa; color: #222; }
h1 { border-bottom: 3px solid #4363d8; padding-bottom: 0.3rem; }
h2 { margin-top: 1.8rem; color: #333; }
.subtitle { color: #666; font-size: 0.95rem; }
table { border-collapse: collapse; margin-top: 0.8rem; background: #fff; }
th, td { border: 1px solid #ddd; padding: 5px 12px; font-size: 13px; }
th { background: #f0f0f0; }
.marker-legend span { margin-right: 1.2rem; }
.note { font-size: 0.85rem; color: #777; }
</style>
</head>
<body>

<h1>⚡ Fuel Cell Performance Ladder</h1>
<p class="subtitle">各類型燃料電池最佳性能紀錄（2016–2026）· 資料經三源驗證（MinerU 解析 + 讀圖取點 + DOI 核對）· <a href="https://github.com/Linch-Lab/fuel-cell-performance-ladder">GitHub</a></p>

<div class="marker-legend">
  <span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#333"/></svg> PGM（貴金屬）</span>
  <span><svg width="14" height="14"><rect x="2" y="2" width="10" height="10" fill="#333"/></svg> PGM-free（非貴金屬）</span>
  <span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="none" stroke="#333" stroke-width="2"/></svg> H₂/O₂ 量測（空心+虛線）</span>
  <span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#333"/></svg> H₂/air 量測（實心+實線）</span>
</div>

<div id="chart"></div>

<h2>📋 商業系統效率（車用 / 固定式）</h2>
<div id="commercial_chart"></div>

<h2>📋 操作條件與來源參考資料</h2>
<div id="refs"></div>

<p class="note">⚠️ 數據持續擴充中——目前為 review 文獻文本提取 + 官方商業規格；極化曲線讀圖取點進行中。CC BY 4.0（資料/圖）· MIT（程式碼）。</p>

<script>
const DATA = {"PEMFC": [[2024, "PGM", "O2", 2031, null, "ZIF-Pt-Co-Ni", "Nano Energy 2024 (10.1016/j.nanoen.2023.109154)"], [2016, "PGM", "O2", 2000, null, "Au@Pt core-shell, 10k cycles", "Chemelectrochem 2016 (10.1002/celc.201600046)"], [2017, "PGM", "O2", 1365, null, "Pt-Pd nanodendrites", "IJHE 2017 (10.1016/j.ijhydene.2017.08.162)"], [2019, "PGM", "O2", 1300, null, "Pt-Pd/C coupled (HT-PEMFC)", "IJHE 2019 (10.1016/j.ijhydene.2018.07.192)"], [2022, "PGM", "air", 1170, null, "PtCo intermetallic", "Nat. Commun. 2022 (10.1038/s41467-022-34037-7)"], [2016, "PGM", "air", 841, null, "PtFeCo/C ternary alloy", "IJHE 2016 (10.1016/j.ijhydene.2016.04.109)"]], "AEMFC": [[2016, "PGM", "O2", 700, null, "60-80°C, radiation-grafted AEM", "EES 2016 Ponce-Gonzalez (10.1039/c6ee01958g)"], [2017, "PGM", "O2", 1000, null, "60-80°C, PtRu, water-balanced", "JPS 2017 Omasta (10.1016/j.jpowsour.2017.05.006)"], [2016, "PGM", "O2", 300, null, "Pd-Ni bifunctional HOR", "JPS 2016 Alesker (10.1016/j.jpowsour.2015.11.026)"], [2008, "PGM-free", "O2", 100, null, "Completely PGM-free", "PNAS 2008 (10.1073/pnas.0810041106)"]], "HT-PEMFC": [[2018, "PGM", "O2", 512, null, "120°C, CNT/ABPBI/Pt@IL", "Luo 2018 ChemCatChem (10.1002/cctc.201801256)"], [2015, "PGM", "O2", 482, null, "160°C, binderless Pt 0.1mg", "Martin 2015 JPS 293:51-56 (10.1016/j.jpowsour.2014.08.112)"], [2010, "PGM", "O2", 715, null, "150°C, membrane immobilization", "Sun 2010 IJHE 35:2921-25 (10.1016/j.ijhydene.2009.05.049)"], [2018, "PGM-free", "O2", 185, null, "160°C, BP-FeNC", "Hu 2018 Appl. Catal. B 234:357-64 (10.1016/j.apcatb.2018.03.056)"]], "O-SOFC": [[2009, "PGM-free", "air", 2000, null, "650°C, ESB/GDC bilayer", "Ahn 2009 Electrochem. Commun. (10.1016/j.elecom.2009.05.041)"], [2011, "PGM-free", "air", 1257, null, "520°C, ZnO/NiO-SDC", "Raza 2011 Electrochem. Commun. (10.1016/j.elecom.2011.05.032)"], [2017, "PGM-free", "air", 1200, null, "500°C, SCNT cathode", "Li 2017 Nat. Commun. (10.1038/ncomms13990)"], [2016, "PGM-free", "air", 2500, null, "900°C, impregnated electrodes", "Kim 2016 Int. J. Energy Res. (10.1002/er.3465)"], [2013, "PGM-free", "air", 1750, null, "800°C, anode pore structure", "Sarikaya 2013 IJHE (10.1016/j.ijhydene.2013.05.160)"]], "P-SOFC": [[2014, "PGM-free", "air", 431, null, "600°C, SNS electrolyte", "Wei 2014 EES (10.1039/c3ee43730b)"]]};
const COLORS = {"PEMFC": "#e6194b", "HT-PEMFC": "#3cb44b", "O-SOFC": "#4363d8", "P-SOFC": "#f58231", "AEMFC": "#911eb4", "COMMERCIAL": "#808080"};
const MARKERS = {"PGM": "circle", "PGM-free": "square"};
const COMMERCIAL = {"車用 PEMFC": [[2014, "Mirai 一代", 64, "LHV, ANL 實測 <10kW", "DOE Record 20005"], [2016, "Honda Clarity", 60, "LHV, 官方", "hondanews 2015"]], "固定式 PEMFC": [[2019, "Panasonic Ene-Farm", 41, "LHV, 0.7kW, 改質NG", "panasonic.biz"]], "固定式 SOFC": [[2022, "Bloom Energy Server H2", 52, "LHV, 300kW, net AC", "bloomenergy.com datasheet"], [2024, "Bloom H2 SOFC", 60, "LHV, 100% H2, BOL", "bloomenergy.com 2024-08-05"]], "固定式 MCFC/PAFC": [[2020, "FCE SureSource 4000", 60, "LHV, AC net, MCFC", "globenewswire 2020"], [2023, "Doosan PureCell M400 H2", 50, "LHV, PAFC, 440kW", "doosanfuelcell.com"]]};
const COMM_COLORS = {"車用 PEMFC": "#e6194b", "固定式 PEMFC": "#3cb44b", "固定式 SOFC": "#4363d8", "固定式 MCFC/PAFC": "#f58231"};

// === 電池紀錄圖（上：峰值功率；下：電流密度@0.65V）===
// 每技術 × 每催化劑 × 每氣體 = 一條獨立線
const traces = [];
for (const [tech, pts] of Object.entries(DATA)) {
  for (const cat of ['PGM', 'PGM-free']) {
    for (const gas of ['air', 'O2']) {
      // 峰值功率
      const selP = pts.filter(p => p[1] === cat && p[2] === gas && p[3] !== null).sort((a,b) => a[0]-b[0]);
      if (selP.length > 0) {
        const hollow = gas === 'O2';
        traces.push({
          x: selP.map(p => p[0]), y: selP.map(p => p[3]/1000),
          mode: 'lines+markers',
          name: `${tech} (${cat}, ${gas})`,
          line: {color: COLORS[tech] || '#000', width: 2, dash: hollow ? 'dash' : 'solid'},
          marker: {
            symbol: MARKERS[cat], size: 9,
            color: hollow ? 'rgba(0,0,0,0)' : (COLORS[tech] || '#000'),
            line: {color: COLORS[tech] || '#000', width: 2},
          },
          xaxis: 'x', yaxis: 'y',
          text: selP.map(p => `${p[0]}: ${p[3]} mW/cm² (${gas})<br>${p[5]}<br>${p[6]}`),
          hoverinfo: 'text',
        });
      }
      // 電流密度 @0.65V
      const selC = pts.filter(p => p[1] === cat && p[2] === gas && p[4] !== null).sort((a,b) => a[0]-b[0]);
      if (selC.length > 0) {
        const hollow = gas === 'O2';
        traces.push({
          x: selC.map(p => p[0]), y: selC.map(p => p[4]),
          mode: 'lines+markers',
          name: `${tech} @0.65V (${cat}, ${gas})`,
          line: {color: COLORS[tech] || '#000', width: 2, dash: hollow ? 'dashdot' : 'dot'},
          marker: {
            symbol: MARKERS[cat], size: 9,
            color: hollow ? 'rgba(0,0,0,0)' : (COLORS[tech] || '#000'),
            line: {color: COLORS[tech] || '#000', width: 2},
          },
          xaxis: 'x2', yaxis: 'y2',
          text: selC.map(p => `${p[0]}: ${p[4]} mA/cm² @0.65V (${gas})<br>${p[5]}<br>${p[6]}`),
          hoverinfo: 'text',
        });
      }
    }
  }
}

const layout = {
  grid: {rows: 2, columns: 1, pattern: 'independent'},
  title: {text: 'Fuel Cell Performance Ladder — 電池紀錄 (2016–2026)', font: {size: 16}},
  showlegend: true,
  height: 950,
  xaxis: {title: 'Year', range: [2015.5, 2026.5], dtick: 1},
  xaxis2: {title: 'Year', range: [2015.5, 2026.5], dtick: 1},
  yaxis: {title: 'Peak Power Density (W/cm²)', rangemode: 'tozero'},
  yaxis2: {title: 'Current Density @0.65V (A/cm²)', rangemode: 'tozero'},
  hovermode: 'closest',
  legend: {orientation: 'h', y: -0.15, font: {size: 9}},
  margin: {t: 60, b: 100, l: 70, r: 30},
};
Plotly.newPlot('chart', traces, layout, {responsive: true});

// === 商業系統效率圖 ===
const cTraces = [];
for (const [cat, items] of Object.entries(COMMERCIAL)) {
  const sorted = [...items].sort((a,b) => a[0]-b[0]);
  cTraces.push({
    x: sorted.map(p => p[0]), y: sorted.map(p => p[2]),
    mode: 'lines+markers', name: cat,
    line: {color: COMM_COLORS[cat] || '#000', width: 2},
    marker: {size: 9, color: COMM_COLORS[cat] || '#000'},
    text: sorted.map(p => `${p[1]} (${p[0]}): ${p[2]}%<br>${p[3]}<br>${p[4]}`),
    hoverinfo: 'text',
  });
}
const cLayout = {
  title: {text: 'Commercial Systems Efficiency (LHV, %)', font: {size: 16}},
  xaxis: {title: 'Year', range: [2013.5, 2026.5], dtick: 1},
  yaxis: {title: 'Efficiency (%)', rangemode: 'tozero'},
  showlegend: true, height: 420,
  hovermode: 'closest',
  legend: {orientation: 'h', y: -0.2, font: {size: 10}},
  margin: {t: 50, b: 80, l: 60, r: 30},
};
Plotly.newPlot('commercial_chart', cTraces, cLayout, {responsive: true});

// === 參考資料表 ===
let html = '<table><tr><th>技術</th><th>年份</th><th>催化劑</th><th>氣體</th><th>峰值功率</th><th>操作條件</th><th>來源</th></tr>';
for (const [tech, pts] of Object.entries(DATA)) {
  for (const p of pts) {
    html += `<tr><td>${tech}</td><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3] ? p[3]+' mW/cm²' : '—'}</td><td>${p[5]}</td><td>${p[6]}</td></tr>`;
  }
}
html += '</table>';
document.getElementById('refs').innerHTML = html;
</script>
</body>
</html>
